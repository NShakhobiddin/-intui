name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/sharp-pasteur-yg9aq0, main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Build natijasini branch ildiziga ham commit qilamiz — shunda Pages
      # "Deploy from a branch" (legacy) rejimida qolsa ham sayt tayyor
      # ilovani ko'rsatadi. GITHUB_TOKEN push'i workflow'ni qayta ishga
      # tushirmaydi, shuning uchun loop bo'lmaydi.
      - name: Publish built app to branch root
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q --ignore-unmatch assets workbox-*.js
          cp -r dist/. .
          git add -A
          git commit -m "chore: publish built app to branch root [skip ci]" || echo "no changes"
          git push origin HEAD:${{ github.ref_name }}
      # Pages "Deploy from a branch" rejimida qolib ketsa, xom manba fayllari
      # serve qilinadi (bo'sh sahifa). Majburan workflow rejimiga o'tkazamiz.
      - name: Switch Pages source to GitHub Actions
        continue-on-error: true
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' -o /dev/null -w "PUT pages: %{http_code}\n"
          curl -sS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            | grep -o '"build_type": *"[^"]*"\|"html_url": *"[^"]*"' || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
